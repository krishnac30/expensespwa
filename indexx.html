<style>

<body>
<div id="app">
  <div id="pg-add" class="pg on">

  </div>

<script>
var CURR=[{code:'INR',locale:'en-IN'},{code:'USD',locale:'en-US'},{code:'EUR',locale:'de-DE'},{code:'GBP',locale:'en-GB'}];
var PAYMODES=['Cash','Online','UPI','Credit Card','Debit Card'];
var DCATS=[
  {id:'c1',name:'Food & Dining',icon:'🍴',color:'#FF6B35',budget:0,builtIn:true},
  {id:'c2',name:'Transport',icon:'🚗',color:'#2196F3',budget:0,builtIn:true},
  {id:'c3',name:'Shopping',icon:'🛍️',color:'#E91E8C',budget:0,builtIn:true},
  {id:'c12',name:'Other',icon:'✨',color:'#9E9E9E',budget:0,builtIn:true}
];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtC(a,c){c=c||'INR';var x=CURR.find(r=>r.code===c)||CURR[0];try{return new Intl.NumberFormat(x.locale,{style:'currency',currency:c}).format(a||0);}catch(e){return c+' '+(a||0).toFixed(2);}}
function fmtTime(ds){var d=new Date(ds);return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});}
function fmtLong(ds){var d=new Date(ds);return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function dlbl(ds){var d=new Date(ds),t=new Date(),y=new Date(t);y.setDate(y.getDate()-1);if(d.toDateString()===t.toDateString())return'Today';if(d.toDateString()===y.toDateString())return'Yesterday';return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function mlbl(ds){var d=new Date(ds),t=new Date();if(d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth())return'This Month';var lm=new Date(t.getFullYear(),t.getMonth()-1,1);if(d.getFullYear()===lm.getFullYear()&&d.getMonth()===lm.getMonth())return'Last Month';return d.toLocaleDateString('en-IN',{month:'long',year:'numeric'});}
function nowISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function ge(id){return document.getElementById(id);}
function pmColor(pm){var m={'Cash':'#4CAF50','Online':'#2196F3','UPI':'#9C27B0','Credit Card':'#FF6B35','Debit Card':'#607D8B'};return m[pm]||'#9E9E9E';}
function showToast(msg){var t=ge('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

var DB={
  expenses:[],incomes:[],cats:[],tags:[],photos:{},
  load:function(){
    this.expenses=JSON.parse(localStorage.getItem('et_exp')||'[]');
    this.incomes=JSON.parse(localStorage.getItem('et_inc')||'[]');
    this.tags=JSON.parse(localStorage.getItem('et_tags')||'[]');
    this.photos=JSON.parse(localStorage.getItem('et_photos')||'{}');
    var sv=JSON.parse(localStorage.getItem('et_cats')||'null');
    if(sv){var cu=sv.filter(c=>!c.builtIn);var bi=DCATS.map(dc=>{var s=sv.find(x=>x.id===dc.id);return s?Object.assign({},dc,{budget:s.budget}):Object.assign({},dc);});this.cats=cu.concat(bi);}
    else{this.cats=DCATS.map(c=>Object.assign({},c));}
  },
  save:function(){localStorage.setItem('et_exp',JSON.stringify(this.expenses));localStorage.setItem('et_inc',JSON.stringify(this.incomes));localStorage.setItem('et_cats',JSON.stringify(this.cats));localStorage.setItem('et_tags',JSON.stringify(this.tags));},
  saveP:function(){localStorage.setItem('et_photos',JSON.stringify(this.photos));},
  cat:function(id){return this.cats.find(c=>c.id===id)||{name:'Other',icon:'✨',color:'#9E9E9E',budget:0};}
};

var S={
  tab:'add',eSearch:'',eCatF:null,eTagF:null,openSh:null,prevSh:null,editExpId:null,activePx:'',
  ae:{amt:'',cur:'INR',catId:'c1',name:'',date:'',note:'',tags:[],ptags:[],photoId:null,photoUrl:null,payMode:'Cash'},
  ai:{amt:'',cur:'INR',title:'',date:'',note:''}
};
function freshAe(){return{amt:'',cur:'INR',catId:'c1',name:'',date:'',note:'',tags:[],ptags:[],photoId:null,photoUrl:null,payMode:'Cash'};}

function openSheet(name){
  if(S.openSh&&S.openSh!==name){var ps=ge('sh-'+S.openSh);if(ps)ps.classList.remove('on');S.prevSh=S.openSh;}
  S.openSh=name;ge('ov').classList.add('on');
  if(name==='editexp')bEditExpSheet();
  else if(name==='addinc')bAddInc();
  else if(name==='settings')bSettings();
  var sh=ge('sh-'+name);if(sh)requestAnimationFrame(()=>sh.classList.add('on'));
}
function closeSheet(name){
  name=name||S.openSh;var sh=ge('sh-'+name);if(sh)sh.classList.remove('on');
  if(S.openSh===name)S.openSh=null;
  if(S.prevSh){var p=S.prevSh;S.prevSh=null;openSheet(p);return;}
  ge('ov').classList.remove('on');
}
function closeAll(){
  ['editexp','addinc','expdet','incdet','settings'].forEach(n=>{var s=ge('sh-'+n);if(s)s.classList.remove('on');});
  S.openSh=null;S.prevSh=null;ge('ov').classList.remove('on');
}

function switchTab(tab){
  S.tab=tab;
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ge('tabAdd').classList.toggle('on',tab==='add');
  ge('pg-'+tab).classList.add('on');
  if(tab==='add')renderAdd();
  else if(tab==='expenses')renderExp();
  else if(tab==='income')renderInc();
  else if(tab==='budget')renderBudg();
  else if(tab==='dashboard')renderDash();
}

function buildExpFormHTML(ae, px){
  var cat=DB.cat(ae.catId);
  var ac=DB.cats;
  var h='<div class="ab"><div class="aic" id="'+px+'-ico">'+cat.icon+'</div>';
  h+='<input class="ain" id="'+px+'-amount" type="tel" inputmode="decimal" placeholder="0" value="'+esc(ae.amt)+'">';
  h+='<div class="afm" id="'+px+'-fmt">'+(ae.amt?fmtC(parseFloat(ae.amt)||0,ae.cur):'')+'</div>';
  h+='<select class="acr" id="'+px+'-cur">';
  CURR.forEach(c=>{h+='<option value="'+c.code+'"'+(c.code===ae.cur?' selected':'')+'>'+c.code+'</option>';});
  h+='</select></div>';
  h+='<div class="fg"><label class="fl">Name</label><input class="fi" id="'+px+'-name" type="text" placeholder="e.g. Coffee" value="'+esc(ae.name)+'"></div>';
  h+='<div class="fg"><label class="fl">Payment Mode</label><div class="pmrow" id="'+px+'-pmr">';
  PAYMODES.forEach(pm=>{h+='<div class="pm'+(pm===(ae.payMode||'Cash')?' on':'')+'" data-pm="'+pm+'">'+pm+'</div>';});
  h+='</div></div>';
  h+='<div class="cgw"><div class="cgh"><span class="cgl">Category</span></div><div class="cg" id="'+px+'-cat">';
  ac.forEach(c=>{var s=c.id===ae.catId;h+='<div class="cc'+(s?' on':'')+'" style="border-color:'+(s?c.color:'transparent')+'" data-catid="'+c.id+'"><div class="cci" style="background:'+c.color+'20">'+c.icon+'</div><div class="ccn">'+esc(c.name)+'</div></div>';});
  h+='</div></div>';
  h+='<div class="tw"><div class="fl">Tags</div><div class="tp" id="'+px+'-tp">';
  DB.tags.forEach(t=>{h+='<div class="tpi'+((ae.tags||[]).includes(t)?' on':'')+'" data-tag="'+esc(t)+'">'+esc(t)+'</div>';});
  (ae.ptags||[]).forEach(t=>{h+='<div class="tpi on" data-ptag="'+esc(t)+'">'+esc(t)+' <span>×</span></div>';});
  h+='</div><div class="tir"><input class="tti" id="'+px+'-tagIn" type="text" placeholder="New tag…"><button class="tab2" id="'+px+'-tagAdd">Add</button></div></div>';
  h+='<div class="fg"><label class="fl">Receipt Photo</label><div id="'+px+'-parea">';
  if(ae.photoUrl){
    h+='<div class="php"><img src="'+ae.photoUrl+'"><button class="phr" id="'+px+'-phRm">×</button></div>';
  }else{
    h+='<div class="phbrow"><button class="phb" id="'+px+'-phCam">📷 Camera</button><button class="phb" id="'+px+'-phLib">🖼️ Gallery</button></div>';
  }
  h+='</div></div>';
  h+='<div class="fg"><label class="fl">Date &amp; Time</label><input class="fi" id="'+px+'-date" type="datetime-local" value="'+(ae.date||nowISO())+'"></div>';
  h+='<div class="fg"><label class="fl">Note</label><textarea class="fta" id="'+px+'-note" placeholder="Optional note…">'+esc(ae.note||'')+'</textarea></div>';
  return h;
}

function wireFormEvents(px, submitBtnId, onSubmit){
  ge(px+'-amount').addEventListener('input',function(){
    var v=this.value.replace(/[^0-9.]/g,'');
    S.ae.amt=v;this.value=v;
    ge(px+'-fmt').textContent=v?fmtC(parseFloat(v)||0,S.ae.cur):'';
    updFormBtn(submitBtnId);
  });
  ge(px+'-cur').addEventListener('change',function(){S.ae.cur=this.value;var n=parseFloat(S.ae.amt)||0;ge(px+'-fmt').textContent=n?fmtC(n,S.ae.cur):'';});
  ge(px+'-name').addEventListener('input',function(){S.ae.name=this.value;updFormBtn(submitBtnId);});
  ge(px+'-pmr').addEventListener('click',function(e){var p=e.target.closest('[data-pm]');if(!p)return;S.ae.payMode=p.dataset.pm;ge(px+'-pmr').querySelectorAll('.pm').forEach(x=>x.classList.toggle('on',x.dataset.pm===p.dataset.pm));});
  ge(px+'-cat').addEventListener('click',function(e){
    var c=e.target.closest('[data-catid]');if(!c)return;
    S.ae.catId=c.dataset.catid;var cat=DB.cat(S.ae.catId);
    ge(px+'-ico').textContent=cat.icon;
    ge(px+'-cat').querySelectorAll('.cc').forEach(x=>{var s=x.dataset.catid===S.ae.catId;x.classList.toggle('on',s);x.style.borderColor=s?cat.color:'transparent';});
  });
  ge(px+'-tp').addEventListener('click',function(e){
    var t=e.target.closest('[data-tag]');if(t){var tg=t.dataset.tag; if(S.ae.tags.includes(tg)) S.ae.tags=S.ae.tags.filter(x=>x!==tg); else S.ae.tags.push(tg); refFormTP(px);}
    var p=e.target.closest('[data-ptag]');if(p){S.ae.ptags=S.ae.ptags.filter(x=>x!==p.dataset.ptag); refFormTP(px);}
  });
  function addTg(){var v=ge(px+'-tagIn').value.trim().toLowerCase();if(!v)return; if(DB.tags.includes(v)){if(!S.ae.tags.includes(v))S.ae.tags.push(v);}else{if(!S.ae.ptags.includes(v))S.ae.ptags.push(v);} ge(px+'-tagIn').value=''; refFormTP(px);}
  ge(px+'-tagAdd').addEventListener('click',addTg);
  ge(px+'-tagIn').addEventListener('keydown',function(e){if(e.key==='Enter')addTg();});
  setupFormPhotoButtons(px);
  ge(submitBtnId).addEventListener('click',onSubmit);
  updFormBtn(submitBtnId);
}

function refFormTP(px){
  var el=ge(px+'-tp');if(!el)return;var h='';
  DB.tags.forEach(t=>{h+='<div class="tpi'+((S.ae.tags||[]).includes(t)?' on':'')+'" data-tag="'+esc(t)+'">'+esc(t)+'</div>';});
  (S.ae.ptags||[]).forEach(t=>{h+='<div class="tpi on" data-ptag="'+esc(t)+'">'+esc(t)+' <span>×</span></div>';});
  el.innerHTML=h;
}

function setupFormPhotoButtons(px){
  var cam=ge(px+'-phCam'), lib=ge(px+'-phLib'), rm=ge(px+'-phRm');
  if(cam)cam.addEventListener('click',()=> {S.activePx=px; ge('photoCam').click();});
  if(lib)lib.addEventListener('click',()=> {S.activePx=px; ge('photoLib').click();});
  if(rm)rm.addEventListener('click',()=>{
    if(S.ae.photoId){delete DB.photos[S.ae.photoId];DB.saveP();} S.ae.photoId=null;S.ae.photoUrl=null;
    ge(px+'-parea').innerHTML='<div class="phbrow"><button class="phb" id="'+px+'-phCam">📷 Camera</button><button class="phb" id="'+px+'-phLib">🖼️ Gallery</button></div>';
    setupFormPhotoButtons(px);
  });
}
function updFormBtn(btnId){var b=ge(btnId);if(b)b.disabled=!(S.ae.name&&S.ae.amt&&parseFloat(S.ae.amt)>0);}

function renderAdd(){
  ge('addScroll').innerHTML=buildExpFormHTML(S.ae, 'add');
  wireFormEvents('add', 'addSubmit', subAddPage);
}
function subAddPage(){
  var name=(ge('add-name').value||'').trim(), amt=parseFloat(ge('add-amount').value||0);
  if(!name||!amt||amt<=0)return;
  var tags=(S.ae.tags||[]).concat(S.ae.ptags||[]);
  tags.forEach(t=>{if(!DB.tags.includes(t))DB.tags.push(t);});
  DB.expenses.push({id:uid(),name:name,amount:amt,cur:S.ae.cur,catId:S.ae.catId||'c12',date:ge('add-date').value||nowISO(),note:(ge('add-note').value||'').trim(),tags:tags,photoId:S.ae.photoId||null,payMode:S.ae.payMode||'Cash'});
  DB.save(); showToast('✓ Expense added!'); S.ae=freshAe(); renderAdd();
}

function openEditExp(id){
  var e=DB.expenses.find(x=>x.id===id);if(!e)return;
  S.editExpId=id;
  S.ae={amt:String(e.amount),cur:e.cur||'INR',catId:e.catId||'c1',name:e.name||'',date:e.date||'',note:e.note||'',tags:(e.tags||[]).slice(),ptags:[],photoId:e.photoId||null,photoUrl:e.photoId?(DB.photos[e.photoId]||null):null,payMode:e.payMode||'Cash'};
  closeSheet('expdet'); openSheet('editexp');
}
function bEditExpSheet(){
  ge('eeScroll').innerHTML=buildExpFormHTML(S.ae, 'ee');
  wireFormEvents('ee', 'eeSubmit', subEditExp);
}
function subEditExp(){
  var name=(ge('ee-name').value||'').trim(),amt=parseFloat(ge('ee-amount').value||0);
  if(!name||!amt||amt<=0)return;
  var tags=(S.ae.tags||[]).concat(S.ae.ptags||[]);
  tags.forEach(t=>{if(!DB.tags.includes(t))DB.tags.push(t);});
  var data={name:name,amount:amt,cur:S.ae.cur,catId:S.ae.catId||'c12',date:ge('ee-date').value||nowISO(),note:(ge('ee-note').value||'').trim(),tags:tags,photoId:S.ae.photoId||null,payMode:S.ae.payMode||'Cash'};
  var idx=DB.expenses.findIndex(x=>x.id===S.editExpId);
  if(idx>=0){var old=DB.expenses[idx]; if(old.photoId&&old.photoId!==S.ae.photoId){delete DB.photos[old.photoId];DB.saveP();} DB.expenses[idx]=Object.assign({},old,data);}
  DB.save(); showToast('✓ Expense updated!'); S.ae=freshAe(); S.editExpId=null; closeAll();
  if(S.tab==='expenses')renderExp(); if(S.tab==='dashboard')renderDash();
}

function handleFileUpload(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    var id=uid(); DB.photos[id]=ev.target.result; DB.saveP();
    S.ae.photoId=id; S.ae.photoUrl=ev.target.result;
    var a=ge(S.activePx+'-parea');
    if(a) a.innerHTML='<div class="php"><img src="'+S.ae.photoUrl+'"><button class="phr" id="'+S.activePx+'-phRm">×</button></div>';
    setupFormPhotoButtons(S.activePx);
    updFormBtn(S.activePx==='add'?'addSubmit':'eeSubmit');
  };
  r.readAsDataURL(f);
}
ge('photoCam').addEventListener('change',handleFileUpload);
ge('photoLib').addEventListener('change',handleFileUpload);

function openExpDet(id){
  var e=DB.expenses.find(x=>x.id===id);if(!e)return;
  var cat=DB.cat(e.catId), ph=e.photoId?DB.photos[e.photoId]:null;
  var h='<div class="dh" style="background:'+cat.color+'"><div class="dhi">'+cat.icon+'</div><div class="dhn">'+esc(e.name)+'</div><div class="dha">'+fmtC(e.amount,e.cur)+'</div><div class="dhc">'+esc(cat.name)+'</div></div>';
  if(ph) h+='<div class="dp" onclick="viewPhoto(\''+e.photoId+'\')"><img src="'+ph+'"><button class="dpdl">View Photo</button></div>';
  h+='<div class="irs"><div class="ir2"><div class="ik">Date</div><div class="iv">'+fmtLong(e.date)+'</div></div>';
  h+='<div class="ir2"><div class="ik">Payment Mode</div><div class="iv">'+esc(e.payMode||'Cash')+'</div></div>';
  if(e.note) h+='<div class="ir2"><div class="ik">Note</div><div class="iv">'+esc(e.note)+'</div></div>';
  if(e.tags&&e.tags.length) h+='<div class="ir2"><div class="ik">Tags</div><div class="iv">'+e.tags.map(t=>'#'+t).join(' ')+'</div></div>';
  h+='</div><button class="bedit" onclick="openEditExp(\''+id+'\')">Edit Expense</button>';
  ge('edScroll').innerHTML=h; openSheet('expdet');
}

function viewPhoto(pid){
  if(!DB.photos[pid])return;
  ge('pvImg').src=DB.photos[pid]; ge('pv').classList.add('on');
}
ge('pvClose').addEventListener('click',()=>ge('pv').classList.remove('on'));
ge('pvDl').addEventListener('click',()=>{
  var a=document.createElement('a'); a.href=ge('pvImg').src; a.download='Receipt_'+Date.now()+'.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
});
ge('pvShare').addEventListener('click',async ()=>{
  try {
    if(navigator.share){
      var res=await fetch(ge('pvImg').src); var blob=await res.blob();
      var file=new File([blob], 'receipt.png', {type: blob.type});
      await navigator.share({files:[file]});
    } else { ge('pvDl').click(); }
  }catch(e){console.log(e);}
});

function renderExp(){
  ge('catChips').innerHTML='<div class="chip'+(S.eCatF===null?' on':'')+'" data-cat="">All</div>'+DB.cats.map(c=>'<div class="chip'+(S.eCatF===c.id?' on':'')+'" data-cat="'+c.id+'">'+c.icon+' '+esc(c.name)+'</div>').join('');
  var c=ge('expList');
  var exps=DB.expenses.slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(S.eSearch) exps=exps.filter(e=>e.name.toLowerCase().includes(S.eSearch.toLowerCase()));
  if(S.eCatF) exps=exps.filter(e=>e.catId===S.eCatF);
  if(!exps.length){c.innerHTML='<div class="empty"><div class="eej">💸</div><div class="eet">No expenses yet</div></div>';return;}
  var g={},o=[]; exps.forEach(e=>{var l=dlbl(e.date);if(!g[l]){g[l]=[];o.push(l);} g[l].push(e);});
  var h='';
  o.forEach(lbl=>{
    h+='<div class="shd">'+lbl+'</div><div class="ewrap">';
    g[lbl].forEach(e=>{
      var cat=DB.cat(e.catId), ph=e.photoId?DB.photos[e.photoId]:null, pm=e.payMode||'Cash';
      var ic=ph?'<div class="eic"><img src="'+ph+'"></div>':'<div class="eic" style="background:'+cat.color+'20">'+cat.icon+'</div>';
      h+='<div class="er" data-eid="'+e.id+'"><div class="edb" data-delexp="'+e.id+'">Delete</div><div class="ein">'+ic+'<div class="em"><div class="en">'+esc(e.name)+'</div><div class="emt">'+esc(cat.name)+'</div><span class="pmbadge" style="background:'+pmColor(pm)+'18;color:'+pmColor(pm)+'">'+esc(pm)+'</span></div><div class="ergt"><div class="ea">'+fmtC(e.amount,e.cur)+'</div></div></div></div>';
    });
    h+='</div>';
  });
  c.innerHTML=h;
  c.querySelectorAll('.er').forEach(row=>{
    var sx=0,dx=0,sw=false;
    row.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;dx=0;},{passive:true});
    row.addEventListener('touchmove',e=>{dx=e.touches[0].clientX-sx;},{passive:true});
    row.addEventListener('touchend',()=>{if(dx<-50&&!sw){row.classList.add('sw');sw=true;}else if(dx>20&&sw){row.classList.remove('sw');sw=false;}},{passive:true});
    row.querySelector('.ein').addEventListener('click',()=>openExpDet(row.dataset.eid));
    row.querySelector('.edb').addEventListener('click',()=>delExp(row.dataset.eid));
  });
}
ge('esearch').addEventListener('input',function(){S.eSearch=this.value;renderExp();});
ge('catChips').addEventListener('click',function(e){var c=e.target.closest('.chip');if(c){S.eCatF=c.dataset.cat||null;renderExp();}});

function delExp(id){
  DB.expenses=DB.expenses.filter(e=>{
    if(e.id===id&&e.photoId) delete DB.photos[e.photoId];
    return e.id!==id;
  });
  DB.save(); DB.saveP(); renderExp();
}

function bSettings(){
  var h='<div class="shd">Export Data</div>';
  h+='<div class="bac" id="exportCsvBtn">📤 Download All Data as CSV</div>';
  ge('stScroll').innerHTML=h;
  ge('exportCsvBtn').addEventListener('click', exportCSV);
}
function exportCSV(){
  var rows=[['Date','Name','Amount','Currency','Category','PaymentMode','Note','Tags']];
  DB.expenses.forEach(e=>{
    var cat=DB.cat(e.catId);
    rows.push([e.date, '"'+e.name.replace(/"/g,'""')+'"', e.amount, e.cur, '"'+cat.name+'"', e.payMode, '"'+(e.note||'').replace(/"/g,'""')+'"', '"'+(e.tags||[]).join(',')+'"']);
  });
  var csv = rows.map(r=>r.join(',')).join('\n');
  var blob = new Blob([csv], {type: 'text/csv'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = 'Expenses_Export.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function renderDash(){
  var now=new Date();ge('dashTitle').textContent=now.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  var te=DB.expenses.filter(e=>{var d=new Date(e.date);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();});
  var sumTe=te.reduce((s,e)=>s+e.amount,0);
  var h='<div class="exc"><div class="sec" style="color:rgba(255,255,255,0.7)">This Month Expense</div><div class="exn">'+fmtC(sumTe)+'</div></div>';
  h+='<div class="shd">Recent</div><div class="ewrap">';
  te.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5).forEach(e=>{
    var cat=DB.cat(e.catId);
    h+='<div class="er" onclick="openExpDet(\''+e.id+'\')"><div class="ein"><div class="eic" style="background:'+cat.color+'20">'+cat.icon+'</div><div class="em"><div class="en">'+esc(e.name)+'</div><div class="emt">'+esc(cat.name)+'</div></div><div class="ergt"><div class="ea">'+fmtC(e.amount,e.cur)+'</div></div></div></div>';
  });
  h+='</div>';
  ge('dashContent').innerHTML=h;
}

window.onload=function(){
  DB.load();
  switchTab('add'); // Default to Add Expense on startup
  
  document.querySelectorAll('.tb, #tabAdd').forEach(b=>{
    b.addEventListener('click',function(){switchTab(this.dataset.tab);});
  });
  ['ee','ai','ed','id','st'].forEach(p=>{
    var btn=ge(p+'Close'); if(btn) btn.addEventListener('click',()=>closeSheet());
  });
  ge('settingsBtn').addEventListener('click',()=>openSheet('settings'));
};
</script>
</body>
</html>
